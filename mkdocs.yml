site_name: SLAM学习笔记
site_description: 宇树科技算法工程师学习之路
site_author: 黄硕秋
site_url: https://durrianpizza.github.io/slamslam/

repo_name: slamslam
repo_url: https://github.com/DurrianPizza/slamslam

theme:
  name: material
  language: zh
  palette:
    primary: deep orange
    accent: orange
    features:
      - navigation.tabs
      - navigation.sections
      - navigation.instant
      - search.suggest
      - search.highlight
      - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
  - attr_list
  - def_list
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search
  - minify:
      minify_html: true

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.mathjax.org/mathjax/latest/MathJax.js?config=TeX-AMS-MML_HTMLorMML
